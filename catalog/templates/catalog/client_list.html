<!doctype html>
<html>
  <head>
    <title>Clients - WehbeGroup</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body class="bg-light">
    <nav class="navbar navbar-light bg-white shadow-sm mb-4">
      <div class="container d-flex justify-content-between align-items-center">
        <a class="navbar-brand fw-bold" href="{% url 'category_list' %}"
          >&larr; Back to Catalog</a
        >
      </div>
    </nav>

    <div class="container">
      <h2 class="mb-4 text-center">Client Directory</h2>

      <div class="row">
        {% for client in clients %}
        <div class="col-md-4 mb-4">
          <div class="card shadow-sm h-100">
            <div class="card-body text-center p-4">
              <h4 class="card-title mb-1">{{ client.name }}</h4>
              {% if client.shop_name %}
              <h6 class="text-primary mb-3">🏢 {{ client.shop_name }}</h6>
              {% else %}
              <div class="mb-3"></div>
              {% endif %}

              <a
                href="{% url 'client_detail' client.id %}"
                class="btn btn-outline-primary w-100"
              >
                View Orders
              </a>
            </div>
          </div>
        </div>
        {% empty %}
        <div class="col-12 text-center mt-5">
          <p class="lead text-muted">No clients have been created yet.</p>
        </div>
        {% endfor %}
      </div>
    </div>
  </body>
</html>
